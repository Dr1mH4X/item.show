<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="A lightweight static dashboard to browse your personal items and their lifecycle cost."
        />
        <meta name="theme-color" content="#0891b2" />
        <title>item.show</title>

        <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
        <link rel="apple-touch-icon" href="assets/icon-192.png" />
        <link rel="manifest" href="manifest.json" />

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />
        <link rel="stylesheet" href="css/styles.css" />

        <script src="https://cdn.jsdelivr.net/npm/animejs@4.2.2/dist/bundles/anime.umd.min.js"></script>
    </head>
    <body>
        <div id="bgAnimation" class="bg-animation"></div>

        <header id="mainHeader">
            <div class="logo">
                <i class="fas fa-boxes"></i>
                <h1 id="appTitle">item.show</h1>
            </div>
            <div class="header-controls">
                <a
                    class="icon-btn"
                    href="https://github.com/Dr1mH4X/item.show"
                    target="_blank"
                    rel="noopener"
                    aria-label="GitHub repository"
                    title="GitHub"
                >
                    <i class="fab fa-github"></i>
                </a>
                <div class="toggle-group" id="langGroup">
                    <button class="toggle-btn active" data-val="zh-CN">
                        中文
                    </button>
                    <button class="toggle-btn" data-val="en">EN</button>
                </div>

                <div class="toggle-group" id="themeGroup">
                    <button class="toggle-btn active" data-val="auto">
                        <i class="fas fa-circle-half-stroke"></i>
                    </button>
                    <button class="toggle-btn" data-val="light">
                        <i class="fas fa-sun"></i>
                    </button>
                    <button class="toggle-btn" data-val="dark">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>

                <div class="mobile-controls">
                    <button
                        id="mobileLangBtn"
                        class="icon-btn"
                        type="button"
                        title="切换语言 / Switch language"
                    >
                        <i class="fas fa-globe"></i>
                    </button>
                    <button
                        id="mobileThemeBtn"
                        class="icon-btn"
                        type="button"
                        title="切换主题 / Switch theme"
                    >
                        <i class="fas fa-circle-half-stroke"></i>
                    </button>
                </div>
            </div>
        </header>

        <div class="container">
            <div class="main-content">
                <div class="dashboard">
                    <div class="stats">
                        <div class="stat-card">
                            <div class="icon">
                                <i class="fas fa-dollar-sign"></i>
                            </div>
                            <h3>
                                <span id="totalValueLabel">总资产价值</span>
                                <button id="toggleCalcModeBtn" class="icon-btn">
                                    <i class="fas fa-exchange-alt"></i>
                                </button>
                            </h3>
                            <div class="value" id="totalValue">¥0</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">
                                <i class="fas fa-box"></i>
                            </div>
                            <h3 id="totalItemsLabel">物品总数</h3>
                            <div class="value" id="totalItems">0</div>
                        </div>
                        <div class="stat-card">
                            <div class="icon">
                                <i class="fas fa-calendar-day"></i>
                            </div>
                            <h3 id="avgDailyCostLabel">平均每日成本</h3>
                            <div class="value" id="avgDailyCost">¥0.00</div>
                        </div>
                    </div>
                </div>

                <div class="items-section">
                    <div class="section-header">
                        <h2 id="itemsListTitle">
                            <i class="fas fa-list"></i>
                            <span id="itemsListTitleText">物品资产清单</span>
                        </h2>
                        <button
                            id="sortOrderBtn"
                            class="icon-btn"
                            type="button"
                            aria-pressed="false"
                            data-order="desc"
                            title="按购买日期从新到旧排序"
                        >
                            <i class="fas fa-arrow-down-wide-short"></i>
                        </button>
                    </div>

                    <div class="search-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="搜索物品 / Search items..."
                            data-i18n-placeholder="searchPlaceholder"
                        />
                    </div>

                    <div class="filter-bar" id="categoryFilter">
                        <button class="filter-btn active" data-cat="all">
                            全部
                        </button>
                    </div>

                    <div class="items-grid" id="itemsContainer"></div>
                </div>
            </div>

            <footer class="system-info">
                <p id="timeSourceNote">
                    所有资产成本均基于当前时间计算
                </p>
                <p>
                    © 2025-2026
                    <a
                        href="https://github.com/Dr1mH4X/item.show"
                        target="_blank"
                        rel="noopener"
                        >item.dreamhax.cc</a
                    >
                    .
                    <a href="mailto:cyy00@dreamhax.cc">
                        All rights reserved.</a
                    >
                </p>
            </footer>
        </div>

        <template id="itemCardTemplate">
            <div class="item-card">
                <div class="item-header">
                    <h3 data-field="name"></h3>
                    <div class="price">
                        <span data-field="currency">¥</span
                        ><span data-field="price"></span>
                    </div>
                    <span class="status-tag" data-field="statusText"></span>
                </div>
                <div class="item-body">
                    <div class="item-detail">
                        <span class="detail-label" data-i18n-key="purchaseDate"
                            >购买日期</span
                        >
                        <span
                            class="detail-value"
                            data-field="purchaseDate"
                        ></span>
                    </div>
                    <div class="item-detail">
                        <span class="detail-label" data-i18n-key="warrantyUntil"
                            >保修至</span
                        >
                        <span
                            class="detail-value"
                            data-field="warrantyDate"
                        ></span>
                    </div>
                    <div class="item-detail">
                        <span
                            class="detail-label"
                            data-i18n-key="retirementDate"
                            >退役时间</span
                        >
                        <span
                            class="detail-value"
                            data-field="retirementDate"
                        ></span>
                    </div>
                    <div class="cost-calculation">
                        <div class="title" data-i18n-key="costCalcTitle">
                            成本计算
                        </div>
                        <div class="item-detail">
                            <span class="detail-label" data-i18n-key="dailyCost"
                                >日均成本</span
                            >
                            <span class="detail-value">
                                <span data-field="currency">¥</span
                                ><span data-field="dailyCost"></span>
                            </span>
                        </div>
                        <div class="item-detail">
                            <span class="detail-label" data-i18n-key="daysUsed"
                                >已使用天数</span
                            >
                            <span
                                class="detail-value"
                                data-field="daysUsed"
                            ></span>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <script>
            if ("serviceWorker" in navigator) {
                window.addEventListener("load", () => {
                    navigator.serviceWorker.register("./sw.js").catch((err) => {
                        console.error(
                            "ServiceWorker registration failed:",
                            err,
                        );
                    });
                });
            }
        </script>
        <script src="js/lang.js"></script>
        <script src="js/theme.js"></script>
        <script src="js/data.js"></script>
        <script src="js/animations.js"></script>
        <script src="js/script.js"></script>
    </body>
</html>
